server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 10m;

    # 安全响应头。注意 nginx 语义：子 location 一旦自行声明 add_header，
    # 父级所有 add_header 在该 location 内全部失效，故下方静态资源 location
    # 需要逐一重复声明（不是冗余，是必须）。
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # 内容安全策略（SEC-09）：前端构建产物为纯本地资源，无外链 CDN；
    # style-src 保留 'unsafe-inline' 供 Element Plus 运行时注入的组件样式，
    # img-src 放行 data:/blob: 供头像预览与导出缩略图。
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $http_x_request_id;
        proxy_set_header X-Real-IP $remote_addr;
        # 覆盖式 X-Forwarded-For（而非默认的 $proxy_add_x_forwarded_for 追加式）：
        # 追加式会保留客户端自带的伪造 XFF 前缀，而后端难以判定哪一段可信；
        # 覆盖后 XFF 恒为 nginx 视角的真实来源 IP，后端直接取首段即可，配合
        # LoginAttemptService 的 IP 维度限流使用。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE 长连接支持：关闭缓冲使 text/event-stream 即时透传（后端另设
        # X-Accel-Buffering: no 双保险）；读写超时需高于后端 25s 心跳周期，
        # 避免长连静默 60s 被默认超时断开。
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /healthz {
        proxy_pass http://backend:8080/actuator/health/readiness;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $http_x_request_id;
    }

    location = /version {
        proxy_pass http://backend:8080/actuator/info;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $http_x_request_id;
    }

    location /mobile/ {
        try_files $uri $uri/ /mobile/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        # 父级 add_header 在此 location 内失效，需重新声明（含 CSP）
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;
        try_files $uri =404;
    }
}
