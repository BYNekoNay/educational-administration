name: Synchronize admin lockfile

on:
  push:
    branches:
      - master
      - 'codex/**'
    paths:
      - admin-web/package.json
      - admin-web/package-lock.json
      - .github/workflows/synchronize-admin-lockfile.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  synchronize:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: admin-web/package-lock.json
      - name: Regenerate lockfile without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit synchronized lockfile
        working-directory: .
        run: |
          if git diff --quiet -- admin-web/package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-web/package-lock.json
          git commit -m "chore: synchronize admin dependency lockfile"
          git push
