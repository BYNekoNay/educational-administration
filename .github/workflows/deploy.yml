name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment to deploy to
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

env:
  # Example: registry.cn-hangzhou.aliyuncs.com. Configure these per GitHub
  # Environment so staging and production can use isolated ACR namespaces.
  REGISTRY: crpi-r0gqy992cwxfir87.cn-chengdu.personal.cr.aliyuncs.com
  BACKEND_IMAGE: crpi-r0gqy992cwxfir87.cn-chengdu.personal.cr.aliyuncs.com/educational-administration/educational-administration-backend
  WEB_IMAGE: crpi-r0gqy992cwxfir87.cn-chengdu.personal.cr.aliyuncs.com/educational-administration/educational-administration-web
  IMAGE_TAG: ${{ github.sha }}

jobs:
  verify-ci:
    name: Verify source CI
    runs-on: ubuntu-latest
    steps:
      - name: Require a successful CI run for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          successful_run="$(gh run list \
            --repo "$GH_REPO" \
            --workflow ci.yml \
            --commit "$COMMIT_SHA" \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId // empty')"
          test -n "$successful_run"
          printf 'Using successful CI run %s for commit %s\n' "$successful_run" "$COMMIT_SHA"

  publish-images:
    name: Build and publish images
    runs-on: ubuntu-latest
    needs: verify-ci
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Log in to Alibaba Cloud Container Registry
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: printf '%s' "$ACR_PASSWORD" | docker login "$REGISTRY" -u "$ACR_USERNAME" --password-stdin
      - name: Build and push backend image
        run: |
          docker build --file deploy/Dockerfile.backend --tag "$BACKEND_IMAGE:$IMAGE_TAG" .
          docker push "$BACKEND_IMAGE:$IMAGE_TAG"
      - name: Build and push web image
        run: |
          docker build --file deploy/Dockerfile.web --tag "$WEB_IMAGE:$IMAGE_TAG" .
          docker push "$WEB_IMAGE:$IMAGE_TAG"

  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    needs: publish-images
    environment: ${{ inputs.environment }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Configure SSH
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
        run: |
          test -n "$DEPLOY_SSH_PRIVATE_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # The public ECS host identity is pinned in version control so a stale
          # environment secret cannot silently block every deployment.
          printf '%s\n' '8.145.58.241 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEE598cBascGv8MagM9SVQZX4HR8Lfe4NOGxlQ/DdEI7' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Upload release assets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$DEPLOY_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]]
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ && "$DEPLOY_PATH" != '/' ]]

          ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "install -m 700 -d '$DEPLOY_PATH' '$DEPLOY_PATH/scripts'"
          scp deploy/docker-compose.production.yml "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/docker-compose.yml"
          scp deploy/Caddyfile "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/Caddyfile"
          scp acceptance_test.sh "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/acceptance_test.sh"
          scp sql/schema.sql sql/data.sql sql/verify_high_value_invariants.sql \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
          scp deploy/scripts/*.sh "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/scripts/"
          scp deploy/BACKUP_AND_RESTORE.md deploy/OBSERVABILITY.md deploy/RELEASE_RUNBOOK.md \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
          ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "chmod 600 '$DEPLOY_PATH/docker-compose.yml' '$DEPLOY_PATH/Caddyfile' \
              '$DEPLOY_PATH/schema.sql' '$DEPLOY_PATH/data.sql' \
              '$DEPLOY_PATH/verify_high_value_invariants.sql' '$DEPLOY_PATH/'*.md && \
             chmod 700 '$DEPLOY_PATH/acceptance_test.sh' '$DEPLOY_PATH/scripts/'*.sh"
      - name: Upload protected runtime configuration
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          DEPLOY_SITE_ADDRESS: ${{ secrets.DEPLOY_SITE_ADDRESS }}
          DEPLOY_ORIGIN: ${{ secrets.DEPLOY_ORIGIN }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
        run: |
          set +x
          umask 077
          runtime_directory="$(mktemp -d "$RUNNER_TEMP/eduadmin-deploy.XXXXXX")"
          trap 'rm -rf -- "$runtime_directory"' EXIT
          runtime_env="$runtime_directory/production.env"
          smoke_password_file="$runtime_directory/smoke-password"

          RUNTIME_ENV_PATH="$runtime_env" python <<'PY'
          import os
          from pathlib import Path

          def required(name):
              value = os.environ.get(name, "")
              if not value:
                  raise SystemExit(f"required deployment value is missing: {name}")
              if any(character in value for character in ("\0", "\r", "\n")):
                  raise SystemExit(f"deployment value contains a forbidden control character: {name}")
              return value

          def dotenv_quote(value):
              return "'" + value.replace("'", "\\'") + "'"

          values = {
              "MYSQL_DATABASE": "edu_admin",
              "MYSQL_USER": "edu_admin",
              "MYSQL_PASSWORD": required("MYSQL_PASSWORD"),
              "MYSQL_ROOT_PASSWORD": required("MYSQL_ROOT_PASSWORD"),
              "JWT_SECRET": required("JWT_SECRET"),
              "SITE_ADDRESS": required("DEPLOY_SITE_ADDRESS"),
              "APP_ORIGIN": required("DEPLOY_ORIGIN"),
              "IMAGE_TAG": required("IMAGE_TAG"),
              "BACKEND_IMAGE": required("BACKEND_IMAGE") + ":" + required("IMAGE_TAG"),
              "WEB_IMAGE": required("WEB_IMAGE") + ":" + required("IMAGE_TAG"),
          }
          output = "\n".join(f"{key}={dotenv_quote(value)}" for key, value in values.items()) + "\n"
          Path(os.environ["RUNTIME_ENV_PATH"]).write_text(output, encoding="utf-8")
          PY
          test -n "$SMOKE_PASSWORD"
          printf '%s' "$SMOKE_PASSWORD" > "$smoke_password_file"
          chmod 600 "$runtime_env" "$smoke_password_file"
          docker compose --env-file "$runtime_env" \
            --file deploy/docker-compose.production.yml config --quiet

          scp "$runtime_env" "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/.env.next"
          scp "$smoke_password_file" "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/.smoke-password.next"
          ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "chmod 600 '$DEPLOY_PATH/.env.next' '$DEPLOY_PATH/.smoke-password.next' && \
             mv -f '$DEPLOY_PATH/.env.next' '$DEPLOY_PATH/.env' && \
             mv -f '$DEPLOY_PATH/.smoke-password.next' '$DEPLOY_PATH/.smoke-password'"
      - name: Run verified release gate
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_ORIGIN: ${{ secrets.DEPLOY_ORIGIN }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          [[ "$DEPLOY_ORIGIN" =~ ^https?://[A-Za-z0-9.:-]+$ ]]
          test -n "$ACR_USERNAME"
          test -n "$ACR_PASSWORD"
          printf '%s' "$ACR_PASSWORD" | ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "docker login '$REGISTRY' -u '$ACR_USERNAME' --password-stdin"
          ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && \
             PUBLIC_BASE_URL='$DEPLOY_ORIGIN' \
             EXPECTED_IMAGE_TAG='$IMAGE_TAG' \
             EXPECTED_SCHEMA_VERSION=7 \
             SMOKE_PASSWORD_FILE='$DEPLOY_PATH/.smoke-password' \
             bash scripts/release-production.sh"
