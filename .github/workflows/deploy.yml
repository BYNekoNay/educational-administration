name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment to deploy to
        required: true
        type: choice
        options:
          - staging
          - production
      image_tag:
        description: Optional image tag; defaults to the selected commit SHA
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # OCI repository names must be lowercase. Keep this explicit because the
  # current GitHub owner name contains uppercase characters.
  BACKEND_IMAGE: ghcr.io/bynekonay/educational-administration-backend
  WEB_IMAGE: ghcr.io/bynekonay/educational-administration-web
  IMAGE_TAG: ${{ inputs.image_tag || github.sha }}

jobs:
  publish-images:
    name: Build and publish images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Log in to GitHub Container Registry
        run: echo "${{ github.token }}" | docker login "$REGISTRY" -u "${{ github.actor }}" --password-stdin
      - name: Build and push backend image
        run: |
          docker build --file deploy/Dockerfile.backend --tag "$BACKEND_IMAGE:$IMAGE_TAG" .
          docker push "$BACKEND_IMAGE:$IMAGE_TAG"
          docker tag "$BACKEND_IMAGE:$IMAGE_TAG" "$BACKEND_IMAGE:latest"
          docker push "$BACKEND_IMAGE:latest"
      - name: Build and push web image
        run: |
          docker build --file deploy/Dockerfile.web --tag "$WEB_IMAGE:$IMAGE_TAG" .
          docker push "$WEB_IMAGE:$IMAGE_TAG"
          docker tag "$WEB_IMAGE:$IMAGE_TAG" "$WEB_IMAGE:latest"
          docker push "$WEB_IMAGE:latest"

  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    needs: publish-images
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Configure SSH
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Upload deployment manifest
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH'"
          scp deploy/docker-compose.production.yml "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/docker-compose.yml"
          scp deploy/Caddyfile "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/Caddyfile"
          scp sql/schema.sql sql/data.sql "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
      - name: Deploy containers
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          DEPLOY_DOMAIN: ${{ secrets.DEPLOY_DOMAIN }}
        run: |
          cat <<EOF | base64 | ssh "$DEPLOY_USER@$DEPLOY_HOST" "base64 --decode > '$DEPLOY_PATH/.env'"
          MYSQL_DATABASE=edu_admin
          MYSQL_USER=edu_admin
          MYSQL_PASSWORD=$MYSQL_PASSWORD
          MYSQL_ROOT_PASSWORD=$MYSQL_ROOT_PASSWORD
          JWT_SECRET=$JWT_SECRET
          DOMAIN=$DEPLOY_DOMAIN
          APP_ORIGIN=https://$DEPLOY_DOMAIN
          BACKEND_IMAGE=$BACKEND_IMAGE:$IMAGE_TAG
          WEB_IMAGE=$WEB_IMAGE:$IMAGE_TAG
          EOF
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "cd '$DEPLOY_PATH' && echo '$GHCR_TOKEN' | docker login ghcr.io -u '$GHCR_USERNAME' --password-stdin && docker compose pull && docker compose up -d --remove-orphans && docker compose ps"
