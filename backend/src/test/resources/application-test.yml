# 测试环境配置 — 使用 H2 内存数据库，不依赖 MySQL
spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  datasource:
    # DATABASE_TO_LOWER：与 MySQL 返回小写列标签的行为对齐（本系统少量 Mapper 以 Map 读取列名）
    url: jdbc:h2:mem:eduadmin_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=USER
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      # 集成测试上下文启动时执行建表脚本（结构镜像 sql/schema.sql，见 schema-h2.sql）
      mode: always
      schema-locations: classpath:schema-h2.sql

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: test-secret-key-must-be-at-least-32-byte!!
  expire-minutes: 60

file:
  upload-dir: ./target/test-uploads

logging:
  level:
    com.pzhu.eduadmin: warn
