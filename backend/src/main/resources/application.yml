server:
  port: 8080

spring:
  application:
    name: eduadmin
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  # 开发环境排除 Redis 自动配置（无需本地 Redis 服务）。
  # 如需启用 Redis 缓存（会话共享/JWT 黑名单/统计数据缓存）：
  # 1. 注释掉下方 autoconfigure.exclude 中的 Redis 相关两项
  # 2. 确保 Redis 6.x+ 运行在 localhost:6379
  # 3. 取消注释下方 spring.data.redis 配置段
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  datasource:
    url: jdbc:mysql://localhost:3306/edu_admin?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  data:
    redis:
      host: localhost
      port: 6379
  flyway:
    # 数据库迁移是生产环境的显式契约。本地/演示库继续由 sql/schema.sql
    # 管理（schema.sql 已含 V6/V7 的索引与约束），除非 profile 显式启用。
    enabled: false
mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: ${JWT_SECRET:dev-local-secret-key-for-edu-admin-2026}
  expire-minutes: 120

file:
  upload-dir: ./uploads

logging:
  level:
    com.pzhu.eduadmin: debug

app:
  cors:
    allowed-origins: http://localhost:*,http://127.0.0.1:*
  notification:
    sse:
      # SSE 心跳周期（毫秒）。nginx proxy_read_timeout 需高于此值，避免长连静默断连。
      heartbeat-ms: 25000
    mock-sms:
      # 模拟短信外发通道开关：false=默认关闭；true=站内通知入库后打印 [MOCK-SMS] 日志演示外发
      enabled: false
  risk:
    # 流失预警规则配置（P4）。默认均衡档，参数预留；本期不做管理端 UI 切换。
    enabled: true
    preset: balanced
    f5-extra-enabled: false
    high-threshold: 60
    medium-threshold: 30
    factor-cap:
      f1: 70
      f2: 30
      f3: 35
      f4: 25
      f5: 10
    attendance-window-days: 28
    absence-lookback-days: 45
