server:
  port: 8080

spring:
  application:
    name: eduadmin
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  # 缓存：Redis 作为分布式缓存（P-05）。
  # Redis 6.x+ 需运行在下方 spring.data.redis 指定的地址；Redis 不可用时由 CacheConfig 的
  # 错误处理器降级为直接查询（缓存异常不影响业务），登录失败计数同样降级为内存实现（见 AuthService）。
  cache:
    type: redis
    redis:
      # 看板/风险清单为秒级近实时数据：短 TTL + 写操作主动失效（@CacheEvict）双重保障一致性
      time-to-live: 60s
  datasource:
    url: jdbc:mysql://localhost:3306/edu_admin?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      # 连接/命令超时必须短。Lettuce 默认命令超时 60s，Redis 不可达时每一次
      # @Cacheable 读取都要挂满超时才抛异常，足以把一个接口的响应时间从毫秒拖到分钟级。
      # 缓存与登录计数都是可降级路径，宁可立刻失败回落，也不要拖住主线程。
      connect-timeout: ${SPRING_REDIS_CONNECT_TIMEOUT:1s}
      timeout: ${SPRING_REDIS_TIMEOUT:1s}
  flyway:
    # 数据库迁移是生产环境的显式契约。本地/演示库继续由 sql/schema.sql
    # 管理（schema.sql 已含 V6/V7 的索引与约束），除非 profile 显式启用。
    enabled: false
mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: ${JWT_SECRET:dev-local-secret-key-for-edu-admin-2026}
  expire-minutes: 120

file:
  upload-dir: ./uploads

logging:
  level:
    com.pzhu.eduadmin: debug

app:
  cors:
    allowed-origins: http://localhost:*,http://127.0.0.1:*
  notification:
    sse:
      # SSE 心跳周期（毫秒）。nginx proxy_read_timeout 需高于此值，避免长连静默断连。
      heartbeat-ms: 25000
    mock-sms:
      # 模拟短信外发通道开关：false=默认关闭；true=站内通知入库后打印 [MOCK-SMS] 日志演示外发
      enabled: false
  risk:
    # 流失预警规则配置（P4）。默认均衡档，参数预留；本期不做管理端 UI 切换。
    enabled: true
    preset: balanced
    f5-extra-enabled: false
    high-threshold: 60
    medium-threshold: 30
    factor-cap:
      f1: 70
      f2: 30
      f3: 35
      f4: 25
      f5: 10
    attendance-window-days: 28
    absence-lookback-days: 45
